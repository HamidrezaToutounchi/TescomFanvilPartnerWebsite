map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# 1. Tanımsız Host / Doğrudan IP İsteklerini Reddet (444 Connection Closed)
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

# 2. Sadece Resmi Alan Adları (fanvilpartner.com & www.fanvilpartner.com)
server {
    listen 80;
    server_name fanvilpartner.com www.fanvilpartner.com;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Güvenlik Başlıkları (server bloğu düzeyinde, always ile)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.fanvil.com; connect-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Gzip sıkıştırma (Hızlı yükleme için)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Backend API (/api/leads, /api/health, /api/admin/*)
    # ^~ operatörü regex (.js/.css) kuralının bu bloğu ezmesini engeller
    location ^~ /api/ {
        proxy_pass http://fanvil-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 32k;
    }

    # Admin Paneli (/admin ve /admin/assets/*.js, *.css dahil tüm alt yollar)
    # ^~ operatörü sayesinde alttaki .js/.css regex bloğu /admin/assets dosyalarını yutmaz!
    location ^~ /admin {
        proxy_pass http://fanvil-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 32k;
    }

    # Ana sitenin statik dosyaları için önbellekleme (Cache)
    # NOT: nginx'te location bloğunda add_header kullanıldığında üst bloktaki header'lar miras alınmaz;
    # bu nedenle güvenlik başlıkları burada da tekrar edilmiştir.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.fanvil.com; connect-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri =404;
    }

    # React SPA yönlendirmesi (/kvkk dahil tüm frontend rotaları)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
